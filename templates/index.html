<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Zynora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

background:
radial-gradient(circle at top,#7c3aed33,transparent),
#09090f;

height:100vh;

overflow:hidden;

color:white;

}

.app{

height:100vh;

display:flex;

flex-direction:column;

}

.header{

height:70px;

padding:18px;

display:flex;

align-items:center;

gap:12px;

backdrop-filter:blur(20px);

border-bottom:
1px solid #ffffff10;

}

.logo{

width:44px;

height:44px;

border-radius:16px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

background:

linear-gradient(
135deg,
#7c3aed,
#a855f7
);

}

.title{

font-size:18px;

font-weight:600;

}

.status{

font-size:12px;

color:#9ca3af;

}

.messages{

flex:1;

overflow:auto;

padding:22px;

}

.msg{

display:flex;

margin-bottom:16px;

}

.msg.user{

justify-content:flex-end;

}

.bubble{

padding:14px 18px;

max-width:80%;

border-radius:22px;

line-height:1.7;

word-wrap:break-word;

}

.ai .bubble{

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.06);

}

.user .bubble{

background:

linear-gradient(
135deg,
#7c3aed,
#9333ea
);

}

.inputArea{

padding:18px;

border-top:

1px solid #ffffff10;

}

.box{

display:flex;

gap:12px;

align-items:flex-end;

background:

rgba(255,255,255,.04);

padding:10px;

border-radius:28px;

}

textarea{

flex:1;

background:none;

border:none;

outline:none;

resize:none;

color:white;

font-size:15px;

max-height:140px;

}

button{

width:52px;

height:52px;

border:none;

border-radius:50%;

cursor:pointer;

background:

linear-gradient(
135deg,
#7c3aed,
#9333ea
);

color:white;

font-size:20px;

}

.typing{

display:flex;

gap:6px;

}

.typing span{

width:8px;

height:8px;

border-radius:50%;

background:#b794f4;

animation:b 1s infinite;

}

.typing span:nth-child(2){

animation-delay:.2s;

}

.typing span:nth-child(3){

animation-delay:.4s;

}

@keyframes b{

50%{

transform:translateY(-8px);

}

}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo">

✦

</div>

<div>

<div class="title">

Zynora

</div>

<div class="status">

created by Anandhakrishnan

</div>

</div>

</div>

<div
id="messages"
class="messages">

<div class="msg ai">

<div class="bubble">

Hello 👋<br>
How can I help today?

</div>

</div>

</div>

<div class="inputArea">

<div class="box">

<textarea
id="prompt"
placeholder="Message Zynora..."
></textarea>

<button
onclick="send()">

➜

</button>

</div>

</div>

</div>

<script>

const messages=
document.getElementById(
"messages"
)

const input=
document.getElementById(
"prompt"
)

function add(
text,
role
){

const div=
document.createElement(
"div"
)

div.className=
`msg ${role}`

div.innerHTML=
`
<div class="bubble">
${text}
</div>
`

messages.appendChild(
div
)

messages.scrollTop=
messages.scrollHeight

return div

}

async function send(){

const text=
input.value.trim()

if(!text)
return

add(
text,
"user"
)

input.value=""

const typing=
add(
`
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
`,
"ai"
)

try{

const r=
await fetch(
"/chat",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

message:
text

})

}

)

const data=
await r.json()

typing
.querySelector(
".bubble"
)
.innerHTML=

data.reply

}catch{

typing
.querySelector(
".bubble"
)
.innerHTML=

"Connection error"

}

}

input
.addEventListener(

"keydown",

e=>{

if(
e.key==="Enter"
&&
!e.shiftKey
){

e.preventDefault()

send()

}

}

)

</script>

</body>

</html>
