<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Zynora</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

:root{
--bg:#09090f;
--card:#14141d;
--line:#232332;
--text:#fff;
--muted:#9ca3af;
--accent:#7c3aed;
}

body{

height:100vh;

overflow:hidden;

background:
radial-gradient(
circle at top,
#7c3aed33,
transparent
),
var(--bg);

color:white;

}

.app{

height:100vh;

display:flex;

flex-direction:column;

}

/* HEADER */

.header{

height:72px;

display:flex;

align-items:center;

padding:18px;

gap:14px;

backdrop-filter:
blur(20px);

border-bottom:
1px solid var(--line);

}

.logo{

width:46px;

height:46px;

border-radius:16px;

display:flex;

justify-content:center;

align-items:center;

font-size:18px;

background:

linear-gradient(
135deg,
#7c3aed,
#a855f7
);

box-shadow:
0 0 30px #7c3aed55;

}

.title{

font-size:18px;

font-weight:600;

}

.status{

font-size:12px;

color:var(--muted);

}

/* CHAT */

.messages{

flex:1;

overflow-y:auto;

padding:

24px
20px
140px;

}

.messages::-webkit-scrollbar{

width:4px;

}

.messages::-webkit-scrollbar-thumb{

background:#333;

border-radius:10px;

}

.msg{

display:flex;

margin-bottom:18px;

}

.msg.user{

justify-content:flex-end;

}

.bubble{

padding:

14px
18px;

max-width:82%;

line-height:1.7;

border-radius:24px;

word-break:break-word;

animation:
fade .2s;

}

.ai .bubble{

background:

rgba(
255,
255,
255,
.04
);

border:

1px solid
rgba(
255,
255,
255,
.06
);

}

.user .bubble{

background:

linear-gradient(
135deg,
#7c3aed,
#9333ea
);

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(
10px
);

}

to{

opacity:1;

}

}

/* INPUT */

.inputArea{

position:fixed;

bottom:0;

left:0;

right:0;

padding:

12px
16px
max(
16px,
env(
safe-area-inset-bottom
)
);

background:

linear-gradient(
to top,
#09090f,
rgba(
9,
9,
15,
.85
)
);

backdrop-filter:

blur(
30px
);

border-top:

1px solid
var(--line);

}

.box{

display:flex;

align-items:flex-end;

gap:10px;

max-width:900px;

margin:auto;

padding:10px;

border-radius:30px;

background:

rgba(
255,
255,
255,
.05
);

border:

1px solid
rgba(
255,
255,
255,
.06
);

}

textarea{

flex:1;

background:none;

border:none;

outline:none;

color:white;

resize:none;

font-size:15px;

padding:12px;

min-height:28px;

max-height:120px;

}

textarea::placeholder{

color:#888;

}

.send{

width:54px;

height:54px;

border:none;

border-radius:50%;

background:

linear-gradient(
135deg,
#7c3aed,
#9333ea
);

color:white;

font-size:20px;

cursor:pointer;

}

/* TYPING */

.typing{

display:flex;

gap:6px;

}

.typing span{

width:8px;

height:8px;

border-radius:50%;

background:#b794f4;

animation:
bounce 1s infinite;

}

.typing span:nth-child(2){

animation-delay:.2s;

}

.typing span:nth-child(3){

animation-delay:.4s;

}

@keyframes bounce{

50%{

transform:
translateY(
-8px
);

}

}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo">

✦

</div>

<div>

<div class="title">

Zynora

</div>

<div class="status">

created by Anandhakrishnan

</div>

</div>

</div>

<div
class="messages"
id="messages">

<div class="msg ai">

<div class="bubble">

Hello 👋<br>
How can I help today?

</div>

</div>

</div>

<div class="inputArea">

<div class="box">

<textarea
id="prompt"
rows="1"
placeholder="Message Zynora..."
></textarea>

<button
class="send"
onclick="send()">

➜

</button>

</div>

</div>

</div>

<script>

const input=
document.getElementById(
"prompt"
)

const messages=
document.getElementById(
"messages"
)

function add(
text,
role
){

const div=
document.createElement(
"div"
)

div.className=
`msg ${role}`

div.innerHTML=
`
<div class="bubble">
${text}
</div>
`

messages.appendChild(
div
)

messages.scrollTop=
messages.scrollHeight

return div

}

async function send(){

const text=
input.value.trim()

if(!text)
return

add(
text,
"user"
)

input.value=""

const typing=
add(
`
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
`,
"ai"
)

try{

const res=
await fetch(
"/chat",
{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

message:
text

})

}

)

const data=
await res.json()

typing
.querySelector(
".bubble"
)
.innerHTML=
data.reply

}
catch{

typing
.querySelector(
".bubble"
)
.innerHTML=
"Connection error"

}

messages.scrollTop=
messages.scrollHeight

}

input
.addEventListener(

"keydown",

e=>{

if(
e.key==="Enter"
&&
!e.shiftKey
){

e.preventDefault()

send()

}

}

)

input
.addEventListener(

"input",

()=>{

input.style.height=
"auto"

input.style.height=
input.scrollHeight+
"px"

}

)

</script>

</body>

</html>
